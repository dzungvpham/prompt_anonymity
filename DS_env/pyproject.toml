[project]
name = "ds-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=0.34.0",
    "datasets>=5.0.0",
    "google-genai>=2.9.0",
    "huggingface-hub>=1.20.1",
    "ipywidgets>=8.1.8",
    "llama-cpp-python>=0.3.2",
    "matplotlib>=3.11.0",
    "peft>=0.13.0",
    "protobuf>=4.25.0",
    "python-dotenv>=1.2.2",
    "regex>=2026.5.9",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=3.0.0",
    "sentencepiece>=0.2.0",
    "spacy>=3.8.14",
    "spacy-syllables>=3.0.2",
    "spacymoji>=3.1.0",
    "torch>=2.4.0",
    "tqdm>=4.68.3",
    "transformers>=4.44.0",
]

# vLLM is the cluster-only Qwen backend (QWEN_BACKEND=vllm). It is optional and
# kept out of the core deps because it often has no wheel for the newest Python
# (e.g. 3.13), which would otherwise break `uv sync` for everyone. Install it
# only where you actually run the GPU path:  uv sync --extra cluster
[project.optional-dependencies]
cluster = [
    "vllm>=0.6.0",
]
