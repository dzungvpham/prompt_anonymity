# Where the dataset build reads its raw inputs and writes its outputs.
#
# This is the packaged default, and it is machine-independent on purpose: with no `path` set,
# each source is downloaded from HuggingFace (into the usual HF cache, $HF_HOME) at the pinned
# revision, so a fresh clone can rebuild the dataset with no local setup.
#
# To point the build at copies you already have -- a shared cluster mirror, a scratch disk --
# do NOT edit this file with machine-specific paths (it is committed and shared). Instead:
#
#   * set them in your .env / environment, which wins over everything here:
#         PROMPT_ANONYMITY_WILDCHAT_RAW=/datasets/.../WildChat-4.8M/snapshots/<rev>/data
#         PROMPT_ANONYMITY_SWE_CHAT_RAW=/datasets/.../SWE-chat/snapshots/<rev>/conversations.parquet
#         PROMPT_ANONYMITY_DATA_DIR=/scratch/prompt-anonymity-data
#   * or copy this file to your repo root as `datasets.toml` (found by walking up from the
#     working directory) or anywhere you like with $PROMPT_ANONYMITY_DATASETS_CONFIG, and
#     uncomment the `path` lines below.
#
# See prompt_anonymity/data/config.py for the full resolution order.

[paths]
# Everything the build produces -- dist/ parquets, the feature cache, the HF mirror -- lives
# here. A relative path is resolved against this file's directory for a config file of your own,
# and against the project root (the directory holding pyproject.toml / .git) for this packaged
# default, so running from a subdirectory still writes to the one `data/` folder.
data_dir = "data"

[sources.wildchat]
# https://huggingface.co/datasets/allenai/WildChat-4.8M -- a gated repo: accept the terms on the
# dataset page and log in (`hf auth login`, or set HF_TOKEN) before the download will work.
# ~4.8M conversations of parquet, so expect a long first download.
hf_repo = "allenai/WildChat-4.8M"
hf_revision = "c827c6df8fcf008219ffaffa4d1dd77491099367"
hf_dir = "data"
# path = "/local/copy/of/WildChat-4.8M/data"

[sources.swe_chat]
# https://huggingface.co/datasets/SALT-NLP/SWE-chat -- one parquet of agent sessions.
hf_repo = "SALT-NLP/SWE-chat"
hf_revision = "f66cca95b14caaa4177f7ed5eaa424608dadcffa"
hf_file = "conversations.parquet"
# path = "/local/copy/of/SWE-chat/conversations.parquet"

[sources.sharechat]
# https://huggingface.co/datasets/tucnguyen/ShareChat -- five CSVs at the repo root, one per
# platform (chatgpt, claude, gemini, grok, perplexity), each a turn-level export. The adapter
# needs all five, so no `hf_file`/`hf_dir` is set and the whole repo (~3.9 GB) is snapshotted.
# Auto-gated: accept the ShareChat Dataset License Agreement on the dataset page and log in
# (`hf auth login`, or set HF_TOKEN) before the download will work.
hf_repo = "tucnguyen/ShareChat"
hf_revision = "a57c741e002684939f577594fdae1559832a584d"
# path = "/local/copy/of/ShareChat"
