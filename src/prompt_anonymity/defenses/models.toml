# Local model checkpoints for the vLLM-backed defenses (openanonymity, ...).
#
# This is the packaged default, and it is machine-independent on purpose: with no local path set,
# vLLM downloads the HuggingFace repo id below and caches it (in the usual place, $HF_HOME) on
# first use, so a fresh clone can run with no local setup.
#
# To point at a copy already on disk (a shared cluster mirror, a scratch disk) instead of
# downloading -- do NOT edit this file with machine-specific paths (it is committed and shared).
# Instead:
#
#   * set it in your .env / environment, which wins over everything here:
#         OPENANON_MODEL=/local/copy/of/gpt-oss-safeguard-120b
#   * or copy this file to your repo root as `models.toml` (found by walking up from the working
#     directory) or anywhere you like with $PROMPT_ANONYMITY_MODELS_CONFIG, and edit the path
#     there.
#
# See prompt_anonymity/defenses/_backends.py's model_path() for the full resolution order.

[openanonymity]
model = "openai/gpt-oss-safeguard-120b"

# The embedder the loo_unlink and afr defenses score against (prompt_anonymity.features.harrier).
#
# UNLIKE THE FIRST ENTRY HERE, this one is NOT expected to download. The featurizer passes
# local_files_only=True on purpose: the defenses run on compute nodes assumed to have no outbound
# network, and a silent download attempt there hangs the job instead of failing it.
#
# It resolves like [afr] below, through `_backends.model_checkpoint`: $HARRIER_MODEL, else the
# cluster's mirror of the repo id (/datasets/ai/*/hub/models--microsoft--harrier-oss-v1-0.6b), else
# the HuggingFace cache. So on Unity this usually needs no configuration at all; the repo id below
# is identity for the cache key and a hint about which weights are meant. Point $HARRIER_MODEL at
# your copy only if it is filed somewhere the mirror lookup will not find it:
#
#     HARRIER_MODEL=/path/to/harrier-oss-v1-0.6b        # in .env, not in this committed file
#
# All three registered variants (harrier, harrier_imperative, harrier_plain) read THIS section --
# they vary the instruction, not the weights -- so do not add a section per variant.
#
# Only the 0.6b size is in scope. If it cannot mount a successful baseline attack on undefended
# text, that is a finding to report -- not a reason to reach for larger weights or a paid API.
[harrier]
model = "microsoft/harrier-oss-v1-0.6b"

# The local generator the leave-one-out defense uses for all three of its generative jobs: the
# "generalize upward" span rewrite, the reference/edited answer pair, and the utility rating. Shared
# with qwen_rewrite by default because it is small enough to sit on one GPU beside Harrier-0.6B,
# which is what keeps the roughly-quadratic scoring loop affordable.
[loo_unlink]
model = "Qwen/Qwen2.5-3B-Instruct"

# The per-turn rewriter (prompt_anonymity.defenses.qwen_rewrite), same weights as [loo_unlink] above
# and for the same reason: small enough to sit on one GPU, and the rewrite is a style transfer
# rather than anything that needs a large model.
#
# A repo id, resolved like the others through `_backends.local_checkpoint` -- $QWEN_HF_REPO, then
# the cluster's mirror (/datasets/ai/*/hub/models--Qwen--Qwen2.5-3B-Instruct), and a HARD ERROR
# rather than a download if neither exists. Set QWEN_ALLOW_DOWNLOAD=1 to opt into fetching it.
[qwen_rewrite]
model = "Qwen/Qwen2.5-3B-Instruct"

# The agent in Agentic Footprint Reduction (prompt_anonymity.defenses.afr). Unlike loo_unlink, which
# demotes its model to a span rewriter, this one IS the optimizer: it reads a real similarity
# measurement and decides what to change, so it needs a model that can actually reason about the
# feedback. A 30B-class model is the floor for that.
#
# FP8 rather than bf16 because Harrier-0.6B co-resides on the same card: ~33 GB of weights plus a KV
# cache leaves room on an 80 GB A100/H100/H200, and none at all on a 48 GB L40S or a 40 GB A100 --
# see experiments/run_afr.sbatch, which constrains the job accordingly. The MoE is chosen over a
# dense 32B on purpose: only ~3B parameters are active per token, and this defense spends ~11
# generations per document, so decode speed is the binding cost.
#
# THIS ENTRY IS A LOCAL PATH, and deliberately so -- it is the one exception to the "no
# machine-specific paths in this committed file" rule at the top, for the same reason
# styleremix.py:92 hardcodes /datasets/ai/llama3/...: nothing of this size should ever be fetched
# by accident. A repo id here means vLLM downloads ~30-50 GB into $HF_HOME on first use, and if
# $HF_HOME still points at a home directory that is a filled disk quota rather than a slow start.
# That has already happened once.
#
# Resolution order (`_backends.model_checkpoint`):
#
#   $AFR_MODEL                          an explicit override, always wins
#   the path below                      Unity's shared model tree
#
# This is the same hub-cache layout the rest of /datasets/ai uses -- /datasets/ai/<family>/hub/
# models--<org>--<name>, as in styleremix.py's llama3 entry and fluency.py's Qwen3-0.6B-Base. It is
# NOT itself loadable: the checkpoint sits in snapshots/<commit>/, and `resolve_model_path` follows
# it there (preferring refs/main when that snapshot is actually on disk).
#
# OFF-CLUSTER this path does not exist and the run fails immediately, naming $AFR_MODEL. That is
# the intended trade: a loud failure on a laptop beats a silent 30 GB download on a compute node.
# Set $AFR_MODEL to a repo id if you actually do want it fetched.
#: bf16, NOT the FP8 sibling beside it. FP8 was tried first and was the wrong call: an A100 has no
#: native FP8, so vLLM falls back to weight-only compression through the Marlin kernel and
#: dequantizes on every forward pass ("Your GPU does not have native support for FP8 computation").
#: That spends compute to save memory on the one corpus-scale job whose bottleneck is compute.
#: FP8 is only worth it on sm_90 (H100/H200); if you constrain the job there, switch back with
#: $AFR_MODEL rather than editing this line.
#:
#: bf16 27B is ~54 GB of weights, which is why AFR_GPU_MEM_UTIL defaults to 0.90 -- and Harrier
#: co-resides OUTSIDE that budget, since it loads first to embed the reference pool.
[afr]
model = "/datasets/ai/qwen3/hub/models--Qwen--Qwen3.8-27B"

# The previous default, kept for the record: "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8" (~33 GB, MoE,
# ~3B active). Nothing that size is mirrored on this cluster, so it would have to be downloaded to
# scratch. "Qwen/Qwen3-32B-AWQ" (~19 GB dense 4-bit) is the smaller fallback if the 27B above turns
# out not to fit beside Harrier -- see AFR_GPU_MEM_UTIL below.
#
# Two serving knobs go with it, both environment-only and both OUTSIDE the cache key (they change
# where the model runs, not what it emits, so tuning them does not invalidate completed work):
#
#     AFR_MAX_MODEL_LEN=32768   served context. NOT the checkpoint's native 262,144 -- that much KV
#                               cache does not fit beside the weights and aborts startup. A document
#                               whose prompt exceeds this is emitted undefended and logged
#                               "too_long", so raise it if the edit log shows many.
#     AFR_GPU_MEM_UTIL=0.75     fraction of the card vLLM may take. Lower than the other defenses'
#                               because Harrier co-resides and loads first.
#     AFR_ALLOW_DOWNLOAD=1      opt in to fetching a checkpoint that is not already on disk. Without
#                               it a non-local checkpoint is a hard error, not a 30 GB download.

# The local reranker behind the listwise_jina_rerank attack
# (prompt_anonymity.attacks.llm.listwise_jina_rerank). UNLIKE the large checkpoints above, this one
# IS expected to download when it is not already on disk: it is 0.6B, it is public, and the attack
# resolves it through `_local.resolve_checkpoint`, where a missing entry is not fatal. Point
# $JINA_RERANKER_MODEL at a local copy (in .env, not in this committed file) when the download is
# the problem rather than the model.
#
# Licensed CC BY-NC 4.0 -- non-commercial. That is fine for this repository's research use and is
# worth knowing before the weights are reused elsewhere.
[jina_reranker]
model = "jinaai/jina-reranker-v3.5"

# The model that rewrites Library of Congress subject headings into EmBad decoy-topic phrases
# (prompt_anonymity.defenses.embad_topics). A repo id, not a path, and resolved through the cluster
# mirror by `_backends.model_checkpoint` -- on Unity that finds
# /datasets/ai/qwen3/hub/models--Qwen--Qwen3.5-9B and nothing is downloaded.
#
# The job is ~181,000 independent one-line rewrites of a *supplied* subject: un-invert a cataloguing
# heading into plain English and name three concrete things inside it. That is a constrained rewrite,
# not open-ended generation -- the diversity comes from LCSH, not from the model -- so a 9B is
# comfortably sized for it and a larger one would buy nothing but hours. Note this is a
# Qwen3_5ForConditionalGeneration (vision-language) checkpoint; embad_topics loads it with
# language_model_only=True, since the image and video towers are dead weight for a text job.
#
#     EMBAD_TOPIC_MODEL=/path/to/checkpoint     # in .env, to override
[embad_topics]
model = "Qwen/Qwen3.5-9B"
