# Resources for `python experiments/run_all_experiments.py --slurm`, both attack families.
#
# THIS IS THE FILE TO EDIT FOR A DIFFERENT CLUSTER. It is the only place partitions, limits and
# accounting flags appear; the launcher itself knows nothing about them. Everything here is
# `sbatch` flags, passed through verbatim -- there is no schema of our own to learn, and anything
# sbatch accepts works. Point elsewhere with `--slurm-config PATH` or
# `$PROMPT_ANONYMITY_SLURM_CONFIG` (e.g. an uncommitted file of your own).
#
# Check what a change produces without submitting anything:
#
#     python experiments/run_all_experiments.py --slurm --dry-run
#
# Flags are concatenated in this order, and sbatch's own last-one-wins rule does the merging:
#
#     --job-name / --output (set per cell by the launcher)
#     [defaults].sbatch
#     [profiles.<name>].sbatch      <- the profile `resource_profile(cell)` chose
#     [overrides.<tag>].sbatch      <- optional, keyed by results-directory name
#     --slurm-arg=... from the command line
#
# So a later table can override an earlier one, and a one-off command-line flag overrides the file.
# The values below are for UMass Unity; job names must be left alone (see [defaults]).
#
# Flags are environment-expanded, so nothing personal or machine-specific has to be committed
# here. A `.env` beside the project is read, the same one the data pipeline uses:
#
#     "--account=$SLURM_ACCOUNT"     unset -> error naming the variable (a wrong account is a
#                                    rejected job or someone else's allocation)
#     "--mail-user=${EMAIL:-}"       unset -> the flag is left out entirely (no address, no mail)
# --- applied to every job ----------------------------------------------------
#
# Deliberately no --time, --mem or --partition here: those differ per profile, and a --time in
# both places is how a job ends up asking for 8 hours under a QOS that caps at 4 and is rejected
# at submit time.
[defaults]
sbatch = [
    "--nodes=1",
    "--open-mode=append",
    "--mail-type=ALL",
    # Set EMAIL in your shell or .env. Without it this flag is dropped and SLURM falls back to
    # the local username, which on a cluster with no MailDomain is not a routable address --
    # i.e. --mail-type stays on but nothing arrives, which is the intended "no mail" outcome.
    "--mail-user=${EMAIL:-}",
]

# --- one per resource class the launcher asks for ----------------------------
#
# The names are `run_all_experiments.resource_profile`'s return values -- the four below for the
# attribution family, the two at the bottom of the file for the clustering one. That function
# encodes what the *experiment* needs (an accelerator, a lot of memory); this file encodes what
# that costs here. A missing profile is a hard error naming the class that wanted it, not a
# silent default.

# Everything but xgboost: BLAS on the CPU, and one process. A GPU would sit idle.
[profiles.cpu]
sbatch = [
    "--partition=cpu-preempt",
    "--cpus-per-task=8",       # --tune-jobs stays 1; the threads go to BLAS
    "--mem=16g",
    "--time=0-04:00:00",
]

# WildChat, non-xgboost. The score matrix is the binding constraint: known0050 is
# 86,255 x 13,694 float32 = 4.72 GB on its own, a low-dimensional nearest-neighbor run measured a
# 14.6 GB peak, and Gemini's 3,072-d vectors add ~2 GB of features on top. Runs have been
# OOM-killed at 16 GB, so this asks for room rather than the measured peak. If a cell still dies,
# shard it by known configuration (`--known-windows 0050` as its own job -- each writes its own
# files into the same directory).
[profiles.cpu_large]
sbatch = [
    "--partition=cpu-preempt",
    "--cpus-per-task=8",
    "--mem=24g",
    "--time=0-04:00:00",
]

# swe-chat on a GPU attack: xgboost (measured 17x on the shape these cells have -- 1,000 documents
# x 3,072 features over 81 authors, 22.1 s CPU against 1.29 s on one A100) and logistic_sgd.
#
# NO `--qos=short`, and that is load-bearing rather than tidying. On Unity `short` carries
# `MaxSubmitJobsPerUser = 1`, so with it this profile could hold exactly ONE queued cell at a time
# and a batch of six failed five submissions with `QOSMaxSubmitJobPerUserLimit`. A launcher whose
# entire job is submitting a grid cannot use a QOS that permits one job. `normal` has no such cap;
# the cost is losing short's scheduling priority, which is the right trade here. Keep the walltime
# under four hours anyway -- these cells are minutes, and a small ask schedules sooner.
[profiles.gpu]
sbatch = [
    "--partition=gpu-preempt",
    "--gpus=1",
    "--constraint=a100|l40s|h100|h200",
    "--cpus-per-task=8",
    "--mem=24g",
    "--time=0-03:59:59",
]

# WildChat on a GPU attack, i.e. `logistic_sgd` -- both axes at once, so neither `gpu` nor
# `cpu_large` fits. What is large here is *host* memory, not device: the fit is comfortable in a
# corner of any card (the weight matrix is 15 MB at 19,711 authors on a ~200-d feature, 242 MB on
# Gemini, and the minibatched logits 646 MB), while the score matrix it produces is 3.4 GB and
# lives in RAM alongside its in-set slice. Measured 15.8 GB peak for a ~200-d grid; Gemini
# adds ~2 GB of feature matrix on top, hence the headroom.
#
# NOT `gpu-preempt`, unlike every other profile here, and not on the `short` QOS. A Gemini cell is
# 15.6x the FLOPs of a ~200-d one (3,072-d against 197-d) and runs for hours, where a
# preemption costs the whole cell -- `run_experiment.py` has no resume, and it clears its own
# predictions_*.csv on the way in. Queue latency is the price for that, and it is the right trade
# at this length. The constraint is by compute capability rather than by card name so an A16 or
# an L4 counts: TF32 needs sm_80+, and a ~200-d grid measured 20 minutes on an A16.
[profiles.gpu_large]
sbatch = [
    "--partition=gpu",
    "--gpus=1",
    "--constraint=sm_80|sm_86|sm_89|sm_90",
    "--cpus-per-task=8",
    "--mem=96g",
    "--time=0-16:00:00",
]

# --- the clustering family's classes -----------------------------------------
#
# What `resource_profile` returns for a clustering cell. Separate from `cpu` / `cpu_large`
# rather than shared with them because the two families are large in different places: an
# attribution cell's peak is its [n_unknown x n_authors] score matrix, a clustering cell's is two
# neighbour graphs, HDBSCAN's minimum spanning tree and componentwise agglomeration's dense
# per-component distance matrix. Both are CPU-only -- the graph is one BLAS matmul through the
# project's blocked kernel and every algorithm here is a CPU graph algorithm, so a GPU would sit
# idle for the whole job. (`--projection contrastive` is the one thing here that wants a device,
# and it is a variant run this launcher does not submit; scripts/run_clustering_gpu_slurm.sh is
# still the way to run it.)

# swe-chat: ~1,000 documents in the test quarter, so every structure above is small.
[profiles.clustering_cpu]
sbatch = [
    "--partition=cpu-preempt",
    "--cpus-per-task=8",       # the threads go to BLAS; the tuning search is single-process
    "--mem=16g",
    "--time=0-04:00:00",
]

# WildChat: 43,127 documents in the test quarter, two feature blocks of 530 MB, the full
# 172,509 x 3,072 matrix held while loading (2.1 GB), and a minimum spanning tree over a ~1.5M-edge
# sparse graph. The by-hand scripts/run_clustering_slurm.sh has asked 32g for exactly this shape
# and its measured diagnostics pass peaked well under it; the headroom over that measurement is for
# componentwise agglomeration, whose dense per-component matrix the by-hand WildChat runs never
# exercised (they passed an explicit three-algorithm list). Two scopes run in one job and the
# measured WildChat cell was ~40 minutes, so four hours is ample.
[profiles.clustering_cpu_large]
sbatch = [
    "--partition=cpu-preempt",
    "--cpus-per-task=8",
    "--mem=32g",
    "--time=0-04:00:00",
]

# A clustering cell whose variant fits a contrastive projection. The fit is the only thing here
# with a device to use -- 30,000 steps of a 3,072 x 1,024 matmul over a 2,048-document batch,
# measured ~6 minutes on one A100 against hours on eight cores; everything after it is the same
# CPU graph work as the profiles above, which is why this asks for host memory as well.
#
# NO `--qos=short`, for the reason spelled out under [profiles.gpu]: on Unity `short` carries
# `MaxSubmitJobsPerUser = 1`, and a launcher whose whole job is submitting a grid cannot use a QOS
# that permits one queued job. The by-hand scripts/run_clustering_gpu_slurm.sh does use it, which
# is correct there -- it submits exactly one.
[profiles.clustering_gpu]
sbatch = [
    "--partition=gpu-preempt",
    "--gpus=1",
    "--constraint=sm_80|sm_86|sm_89|sm_90",
    "--cpus-per-task=8",
    "--mem=48g",
    "--time=0-03:59:59",
]

# --- per-cell exceptions (optional) ------------------------------------------
#
# Keyed by the results-directory tag: `<dataset>_<defense>_<feature>_<attack>` for
# an attribution cell, `<dataset>_<defense>_<feature>` for a clustering one. For the one
# cell that needs something its profile does not give it; delete these rather than growing a
# profile that only ever applies to a single run.
#
# [overrides.wildchat_openanonymity_gemini_embedding_2_nearest_neighbor]
# sbatch = ["--mem=32g"]

# wildchat_*_gemini_embedding_2_plda both OOM'd on cpu_large's 24g too (jobs 63465697, 63465699,
# 2026-08-22), ~35 minutes in rather than 8 -- PLDA's covariance estimation over gemini's 3,072-dim
# embeddings needs much more than over a ~197-dim feature. Matching the 96g this repo already uses for wildchat+gemini_embedding_2 at
# scale (the gpu_large profile) rather than guessing at a smaller number.
[overrides.wildchat_base_gemini_embedding_2_plda]
sbatch = ["--mem=96g"]

[overrides.wildchat_styleremix_gemini_embedding_2_plda]
sbatch = ["--mem=96g"]
