[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-anonymity"
version = "0.1.0"
description = "Experiment code for re-identification attacks on anonymous chatbot/agent prompts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "datasets",
    "huggingface-hub",
    "python-dotenv",
    "tqdm",
    "xgboost>=3.3.0",
    "lingua-language-detector",
    "requests",
    "tiktoken",
    "openai",
    # Claude on Microsoft Foundry (AnthropicFoundry): the listwise Sonnet reranker's foundry
    # provider and EmBad's hosted mutator. Imported lazily by both.
    "anthropic",
    "pyyaml",
]

[project.optional-dependencies]
styleremix = [
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "bitsandbytes",
]
qwen = [
    "vllm",
    "llama-cpp-python",
]
dpmlm = [
    "prompt-anonymity[styleremix]",
    "nltk",
]
dpmlm-pii = [
    "prompt-anonymity[dpmlm]",
    "presidio-analyzer",
    "spacy",
]
argos = [
    "argostranslate",
]
features = [
    "prompt-anonymity[styleremix]",
    "sentence-transformers",
    "transformers",
    "einops",
]
# listwise_jina_rerank.py: the local reranker behind the listwise rerank attack's control arm
# (jina-reranker-v3.5, 0.6B). Reuses torch from [styleremix]; transformers is listed explicitly
# because the attack imports it directly. Lazy-imported inside _ensure_model(), so only a run that
# actually selects that attack needs this extra -- the LLM arm of the same attack needs nothing new
# (requests + python-dotenv are already base dependencies).
rerank = [
    "prompt-anonymity[styleremix]",
    "transformers",
]
defenses = [
    "prompt-anonymity[styleremix]",
    "prompt-anonymity[qwen]",
    "prompt-anonymity[dpmlm]",
    "prompt-anonymity[argos]",
]
# Everything: all defenses + the model-backed featurizer + the PII variant + the local reranker.
# The one-shot extra.
all = [
    "prompt-anonymity[defenses]",
    "prompt-anonymity[features]",
    "prompt-anonymity[dpmlm-pii]",
    "prompt-anonymity[rerank]",
]

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files the package reads at runtime. Without this they are missing from an installed
# (non-editable) copy -- and each is read eagerly enough that its absence is an import-time or
# first-call failure, not a degraded mode.
[tool.setuptools.package-data]
# The dataset build's default source locations, and the user-agent -> device map WildChat
# identities are built from.
"prompt_anonymity.data" = ["datasets.toml", "resources/*.json"]
"prompt_anonymity.defenses" = ["models.toml", "embad_topics.csv"]
# The judge rubric (conversation_judge.yaml), read at import by prompt_judge.load_judge_prompt.
"prompt_anonymity.evaluation.utility" = ["*.yaml"]
