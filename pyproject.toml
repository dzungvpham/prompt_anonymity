[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-anonymity"
version = "0.1.0"
description = "Experiment code for re-identification attacks on anonymous chatbot/agent prompts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "datasets",
    "huggingface-hub",
    "python-dotenv",
    "tqdm",
    "xgboost>=3.3.0",
]

[project.optional-dependencies]
# GPU model-backed defenses (styleremix.py, qwen_rewrite.py). Not needed for the default
# --defense none pass-through, which reuses the committed StyloMetrix vectors and is GPU-free.
defenses = [
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "bitsandbytes",
    "vllm",
    "llama-cpp-python",
]

[tool.setuptools.packages.find]
where = ["src"]
